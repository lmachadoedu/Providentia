name: Gerar Providentia IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar Xcode
        run: xcodebuild -version

      - name: Compilar Providentia
        run: |
          xcodebuild \
            -project Providentia.xcodeproj \
            -scheme Providentia \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Criar arquivo IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Providentia.app Payload/
          zip -r Providentia.ipa Payload

      - name: Disponibilizar Providentia
        uses: actions/upload-artifact@v4
        with:
          name: Providentia-IPA
          path: Providentia.ipa
          retention-days: 30
